  <script>
    (function(){
      var stub = {
        currentUser: null,
        onAuthStateChanged: function(cb){ cb(null); return function(){}; },
        signInWithEmailAndPassword:     function(){ return Promise.reject(new Error("Firebase ไม่พร้อม")); },
        createUserWithEmailAndPassword: function(){ return Promise.reject(new Error("Firebase ไม่พร้อม")); },
        signInWithPopup:                function(){ return Promise.reject(new Error("Firebase ไม่พร้อม")); },
        sendPasswordResetEmail:         function(){ return Promise.reject(new Error("Firebase ไม่พร้อม")); },
        signOut:                        function(){ return Promise.resolve(); },
        updateProfile:                  function(){ return Promise.resolve(); },
      };
      var dbStub = { collection: function(){ return { doc: function(){ return {
        set: function(){ return Promise.resolve(); },
        get: function(){ return Promise.resolve({exists:false,data:function(){return {};}}); },
        onSnapshot: function(){ return function(){}; }
      };}};} };

      try {
        if(typeof firebase === 'undefined') throw new Error("Firebase SDK ไม่โหลด — ตรวจสอบอินเทอร์เน็ต");
        if (!firebase.apps.length) {
          firebase.initializeApp({
            apiKey:            "AIzaSyDTVFDToIghvsgwwruAEnW9SW-Yda3oLJs",
            authDomain:        "account09.firebaseapp.com",
            projectId:         "account09",
            storageBucket:     "account09.firebasestorage.app",
            messagingSenderId: "184805590193",
            appId:             "1:184805590193:web:4312fa173f3b9e7123ce90"
          });
        }
        var auth = firebase.auth();

        // ใช้ inMemoryPersistence เพื่อหลีกเลี่ยงปัญหา localStorage บน iOS WebView
        try { auth.setPersistence(firebase.auth.Auth.Persistence.SESSION); } catch(_){}

        var db = firebase.firestore();
        db.settings({ experimentalAutoDetectLongPolling: true });

        window._fbAuth = {
          currentUser: null,
          onAuthStateChanged: function(cb){
            return auth.onAuthStateChanged(function(u){ window._fbAuth.currentUser=u; cb(u); });
          },
          signInWithEmailAndPassword:     function(e,p){ return auth.signInWithEmailAndPassword(e,p); },
          createUserWithEmailAndPassword: function(e,p){ return auth.createUserWithEmailAndPassword(e,p); },
          // Google Sign-In: ใช้ redirect แทน popup สำหรับ iOS/in-app browser
          signInWithPopup: function(){
            var provider = new firebase.auth.GoogleAuthProvider();
            // ลอง popup ก่อน ถ้าไม่ได้ใช้ redirect
            return auth.signInWithPopup(provider).catch(function(err){
              if(err.code === 'auth/operation-not-supported-in-this-environment'||
                 err.code === 'auth/popup-blocked' ||
                 err.code === 'auth/popup-closed-by-user'){
                return auth.signInWithRedirect(provider);
              }
              return Promise.reject(err);
            });
          },
          getRedirectResult: function(){ return auth.getRedirectResult(); },
          sendPasswordResetEmail:  function(e){ return auth.sendPasswordResetEmail(e); },
          signOut:                 function(){ return auth.signOut(); },
          updateProfile:           function(u,p){ return u.updateProfile(p); },
        };
        window._fbDb = {
          collection: function(col){
            return { doc: function(id){
              var ref = db.collection(col).doc(id);
              return {
                set:        function(d,o){ return ref.set(d,o||{}); },
                get:        function(){   return ref.get(); },
                onSnapshot: function(cb,err){ return ref.onSnapshot(cb,err||function(){}); },
              };
            }};
          }
        };
        // เช็ค redirect result (กรณีกลับจาก Google login)
        auth.getRedirectResult().then(function(result){
          if(result && result.user) console.log("Redirect login success:", result.user.email);
        }).catch(function(){});

        window._fbReady = true;
      } catch(e) {
        console.error("Firebase init failed:", e);
        window._fbReady = false;
        window._fbAuth = stub;
        window._fbDb   = dbStub;
      }
      window._firebaseInitDone = true;
    })();

<body><div id="root"></div>
<script type="text/babel">
const {useState,useMemo,useEffect}=React;

const CREDIT_TYPES=[
{value:“bad_debt”,         label:“เครดิตเสีย”,           color:”#ef4444”},
{value:“loan”,             label:“เครดิตเงินกู้”,         color:”#f97316”},
{value:“scan_outside”,     label:“สแกนของนอกร้าน”,       color:”#8b5cf6”},
{value:“in_store”,         label:“ซื้อของร้าน (เครดิต)”, color:”#3b82f6”},
{value:“installment_goods”,label:“ผ่อนสินค้า”,            color:”#10b981”},
];
const PAY_MODES=[
{value:“principal_interest”,label:“ต้น + ดอก (ปกติ)”},
{value:“interest_only”,     label:“จ่ายแต่ดอก”},
{value:“custom_schedule”,   label:“กำหนดวันเองรายครั้ง”},
];
const FREQ=[
{value:“daily”,  label:“รายวัน”},
{value:“weekly”, label:“รายสัปดาห์”},
{value:“monthly”,label:“รายเดือน”},
{value:“custom”, label:“กำหนดเองแต่ละครั้ง”},
];
const MONTHS=[“ม.ค.”,“ก.พ.”,“มี.ค.”,“เม.ย.”,“พ.ค.”,“มิ.ย.”,“ก.ค.”,“ส.ค.”,“ก.ย.”,“ต.ค.”,“พ.ย.”,“ธ.ค.”];

const genId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

// ── NORMALIZERS: บังคับทุก numeric field เป็น Number เสมอ ──
// ป้องกัน JSON.parse คืน string จาก localStorage แล้วเกิด string concatenation
const toN=v=>+v||0;
const normalizeDebt=d=>({…d,
principalMom:toN(d.principalMom), principalUs:toN(d.principalUs),
creditPrice:toN(d.creditPrice),   totalInstallments:toN(d.totalInstallments),
interestAmt:toN(d.interestAmt),   momProfitRatio:+d.momProfitRatio||0.5,
splitMode:d.splitMode||“shared”,
});
const normalizePayment=p=>({…p, amount:toN(p.amount)});
const normalizeSale=s=>({…s, revenue:toN(s.revenue), cost:toN(s.cost)});
const normalizeWallet=w=>({
seedCash:toN(w?.seedCash),
entries:(w?.entries||[]).map(e=>({…e,amount:toN(e.amount)})),
});

const today=()=>new Date().toISOString().slice(0,10);
const fmt=n=>Math.round(n||0).toLocaleString(“th-TH”);
const fmtD=n=>(n||0).toLocaleString(“th-TH”,{minimumFractionDigits:2,maximumFractionDigits:2});
const thDate=iso=>{if(!iso)return”-”;const[y,m,d]=iso.split(”-”);return`${+d} ${MONTHS[+m-1]} ${+y+543}`};
// BUG FIX 1: mKey was a string, not a function
const mKey=iso=>iso?iso.slice(0,7):””;
const mLabel=k=>{if(!k)return””;const[y,m]=k.split(”-”);return`${MONTHS[+m-1]} ${+y+543}`};
const daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/(1000*86400));
const addDays=(iso,n)=>{const d=new Date(iso);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const addMonths=(iso,n)=>{const d=new Date(iso);d.setMonth(d.getMonth()+n);return d.toISOString().slice(0,10)};
const addWeeks=(iso,n)=>addDays(iso,n*7);

const lsSave=(k,v)=>{try{localStorage.setItem(“cb2_”+k,JSON.stringify(v))}catch(*){}};
const lsLoad=(k,fb)=>{try{const r=localStorage.getItem(“cb2*”+k);return r?JSON.parse(r):fb}catch(_){return fb}};

// ── FIREBASE SYNC ─────────────────────────────────────────────────────────────
// UID-scoped prefix สำหรับ localStorage เมื่อ login แล้ว
// เก็บ: /users/{uid}/data → single doc ที่มี customers, debts, payments, sales, products, wallet, settings
const SYNC_KEYS=[“customers”,“debts”,“payments”,“sales”,“products”,“wallet”,“settings”];
const SYNC_DEBOUNCE_MS=3000; // รอ 3 วิหลังแก้ข้อมูลค่อย push ขึ้น cloud (ป้องกัน write บ่อยเกิน)
let _syncTimer=null;
let _currentUid=null;

// เปลี่ยน prefix localStorage ตาม UID เพื่อแยกข้อมูลแต่ละ account ในอุปกรณ์เดียวกัน
function lsKeyFor(k,uid){ return `fb_${uid||"local"}_${k}`; }
function lsSaveU(k,v,uid=*currentUid){ try{localStorage.setItem(lsKeyFor(k,uid),JSON.stringify(v))}catch(*){} }
function lsLoadU(k,fb,uid=*currentUid){ try{const r=localStorage.getItem(lsKeyFor(k,uid));return r?JSON.parse(r):fb}catch(*){return fb} }

// Push ข้อมูลทั้งหมดขึ้น Firestore (debounced)
function scheduleSyncUp(uid,getData){
if(!uid)return;
clearTimeout(_syncTimer);
_syncTimer=setTimeout(async()=>{
try{
const payload={};
SYNC_KEYS.forEach(k=>{ payload[k]=lsLoadU(k,null,uid); });
payload._updatedAt=new Date().toISOString();
await window._fbDb.collection(“users”).doc(uid).set(payload,{merge:true});
}catch(e){ console.warn(“sync up failed”,e); }
},SYNC_DEBOUNCE_MS);
}

// Pull ข้อมูลจาก Firestore ลง localStorage และคืน object
async function syncDown(uid){
if(!uid)return null;
try{
const snap=await window._fbDb.collection(“users”).doc(uid).get();
// modular SDK: exists เป็น method — snap.exists() หรือ property ก็ได้ตาม wrapper
const hasData=typeof snap.exists===“function”?snap.exists():snap.exists;
if(!hasData)return null;
const data=snap.data();
SYNC_KEYS.forEach(k=>{ if(data[k]!==undefined) lsSaveU(k,data[k],uid); });
return data;
}catch(e){ console.warn(“sync down failed”,e); return null; }
}

// Subscribe realtime — อัปเดต state เมื่อ Firestore เปลี่ยนจากอุปกรณ์อื่น
function subscribeRealtime(uid,onUpdate){
if(!uid)return ()=>{};
return window._fbDb.collection(“users”).doc(uid).onSnapshot(snap=>{
const hasData=typeof snap.exists===“function”?snap.exists():snap.exists;
if(!hasData)return;
const data=snap.data();
SYNC_KEYS.forEach(k=>{ if(data[k]!==undefined) lsSaveU(k,data[k],uid); });
onUpdate(data);
},()=>{});
}

// splitMode:
//  “separate”  → ทุนใคร กำไรคนนั้นได้ (proportional ตามทุน แยกขาด)
//  “shared”    → ทุนรวม แบ่งกำไร % ด้วย momProfitRatio (แบบเดิม)
//  “split_cap” → ทุนแยก แต่กำไรยังแบ่ง proportional ตามทุนแต่ละคน
// ── SPLIT MODE ──────────────────────────────────────────────────────────────
// mode “shared”    : ทุนรวมกัน กำไรรวมแล้วแบ่ง % (slider)
// mode “separate”  : ทุนแยกขาด — กำไรของใครก็เป็นของคนนั้น 100% (ไม่แบ่งข้าม)
//                    แม่ได้กำไร = (creditPrice − totalCap) × (pM/totalCap)  ← proportional ตามทุน
//                    [ผู้ใช้เลือก mode นี้เพราะไม่อยากยุ่งกับกำไรของอีกฝ่าย]
// mode “split_cap” : ทุนแยก แต่กำไรรวมแล้วยังแบ่ง % slider เหมือน shared
//                    ต่างกับ shared ตรงที่: ทุนออกแยก ดูออกชัดว่าใครออกเท่าไหร่
function calcSplit(debt){
const pM=Math.max(0,toN(debt.principalMom));
const pU=Math.max(0,toN(debt.principalUs));
const cp=Math.max(1,toN(debt.creditPrice)||1);
const mode=debt.splitMode||“shared”;
const totalCap=pM+pU||1;
const profit=Math.max(0,cp-(pM+pU));

if(mode===“separate”){
// กำไรแต่ละฝ่ายตามสัดส่วนทุน — ไม่ข้ามกัน
const momProfitAmt=profit*(pM/totalCap);
const usProfitAmt =profit*(pU/totalCap);
return{
splitMode:“separate”,
momRatio:pM/cp,          usRatio:pU/cp,
momProfitRatio:momProfitAmt/cp, usProfitRatio:usProfitAmt/cp,
// เก็บ amt ไว้ให้ preview ใช้
_profitMom:momProfitAmt,  _profitUs:usProfitAmt,
};
}

if(mode===“split_cap”){
// ทุนแยก แต่กำไรรวมแล้วแบ่ง % slider
const mr=Math.min(1,Math.max(0,toN(debt.momProfitRatio)||0.5));
return{
splitMode:“split_cap”,
momRatio:pM/cp, usRatio:pU/cp,
momProfitRatio:(profit*mr)/cp,
usProfitRatio:(profit*(1-mr))/cp,
_profitMom:profit*mr, _profitUs:profit*(1-mr),
};
}

// “shared”: ทุนรวม กำไรแบ่ง %
const mr=Math.min(1,Math.max(0,toN(debt.momProfitRatio)||0.5));
return{
splitMode:“shared”,
momRatio:pM/cp, usRatio:pU/cp,
momProfitRatio:(profit*mr)/cp,
usProfitRatio:(profit*(1-mr))/cp,
_profitMom:profit*mr, _profitUs:profit*(1-mr),
};
}

// buildSchedule แบบเต็ม (ไม่จำกัด horizon) สำหรับใช้คำนวณภายใน
// buildScheduleDisplay (จำกัด 30 วัน) สำหรับแสดงผลในตาราง
function buildFullSchedule(debt){
const sc=debt.schedule;
if(!sc)return[];
if(sc.freq===“custom”){
return(sc.customDates||[]).map(cd=>({
date:cd.date, amtDue:+cd.amount||0, label:cd.label||””,
type:sc.payMode, debtId:debt.id
}));
}
if(!sc.startDate)return[];
const installAmt=sc.payMode===“interest_only”
? +(debt.interestAmt||0)
: Math.round((debt.creditPrice/(debt.totalInstallments||1))*100)/100;
const result=[];
let cur=sc.startDate;
const total=debt.totalInstallments||1;
for(let i=0;i<total&&i<500;i++){
result.push({date:cur, amtDue:installAmt, type:sc.payMode, debtId:debt.id, idx:i});
if(sc.freq===“daily”)        cur=addDays(cur,1);
else if(sc.freq===“weekly”)  cur=addWeeks(cur,1);
else if(sc.freq===“monthly”) cur=addMonths(cur,1);
else break;
if(sc.payMode!==“interest_only”&&i+1>=total) break;
}
return result;
}

function buildSchedule(debt, payments){
// สำหรับแสดงผล: จำกัด horizon 30 วันข้างหน้า
const full=buildFullSchedule(debt);
if(!full.length)return[];
if(debt.schedule?.freq===“custom”)return full;
const horizon=addDays(today(),30);
return full.filter(s=>s.date>=addDays(today(),-7)&&s.date<=horizon);
}

function getOverdue(debt, scheduleOrFull, payments, asOf){
if(!scheduleOrFull.length)return[];
// จับคู่การชำระกับงวด: เรียงงวดตามวันที่ แล้ว match กับ payment ที่จ่ายก่อนหรือตรงวันนัด
const dPayments=payments.filter(p=>p.debtId===debt.id).map(p=>p.date).sort();
const pastDue=scheduleOrFull.filter(s=>s.date<=asOf);
// นับว่าจ่ายครบกี่งวด: ใช้วิธี greedy match — payment แต่ละรายการ “cover” งวดที่เก่าที่สุดที่ยังไม่ถูก cover
const usedPayments=new Set();
const paidInstallments=new Set();
const sortedPastDue=[…pastDue].sort((a,b)=>a.date.localeCompare(b.date));
const sortedPayments=[…dPayments].sort();
let pi=0;
for(const inst of sortedPastDue){
// หา payment ที่จ่ายภายใน 7 วันหลังวันนัด (tolerance)
while(pi<sortedPayments.length&&sortedPayments[pi]<inst.date) pi++;
// รับ payment ที่จ่ายตั้งแต่วันนัดหรือก่อน (±0) ถึง 7 วันหลัง
let found=false;
for(let j=pi;j<sortedPayments.length&&sortedPayments[j]<=addDays(inst.date,7);j++){
if(!usedPayments.has(sortedPayments[j])){
usedPayments.add(sortedPayments[j]);
paidInstallments.add(inst.date+”*”+inst.idx);
found=true; break;
}
}
}
return sortedPastDue.filter(s=>!paidInstallments.has(s.date+”*”+s.idx));
}

// คะแนนเครดิต: คำนวณจากการ match งวดกับการชำระจริง
function calcCreditScore(custDebts, allPayments){
let onTime=0, late=0, totalLateDays=0, hasBadDebt=false;
custDebts.forEach(d=>{
// เครดิตเสียที่ยังค้างอยู่
if(d.creditType===“bad_debt”){
const paid=allPayments.filter(p=>p.debtId===d.id).reduce((a,p)=>a+p.amount,0);
if(paid<d.creditPrice) hasBadDebt=true;
}
const fullSched=buildFullSchedule(d);
if(!fullSched.length)return;
const dPayments=allPayments
.filter(p=>p.debtId===d.id)
.map(p=>p.date)
.sort();
// greedy match งวดกับ payment
const usedPayIdx=new Set();
const sortedSched=[…fullSched].sort((a,b)=>a.date.localeCompare(b.date));
for(const inst of sortedSched){
// หา payment ที่จ่ายตั้งแต่วันนัดหรือก่อนหน้า (แต่ไม่เกิน 60 วันก่อน)
let bestIdx=-1, bestDiff=Infinity;
for(let j=0;j<dPayments.length;j++){
if(usedPayIdx.has(j))continue;
const diff=daysBetween(inst.date,dPayments[j]); // บวก = จ่ายช้า, ลบ = จ่ายเร็ว
if(diff>60)continue;    // จ่ายช้าเกิน 60 วัน ไม่นับ
if(diff>=-90&&Math.abs(diff)<Math.abs(bestDiff)){
bestIdx=j; bestDiff=diff;
}
}
if(bestIdx===-1)continue; // งวดนี้ยังไม่มีการชำระ ข้าม
usedPayIdx.add(bestIdx);
if(bestDiff<=3) onTime++;          // จ่ายตรงเวลา ±3 วัน ถือว่าดี
else if(bestDiff>3){
late++; totalLateDays+=bestDiff;
} else onTime++; // จ่ายก่อน
}
});
const total=onTime+late;
if(total===0&&!hasBadDebt) return{level:“ยังไม่มีประวัติ”,color:”#94a3b8”,pct:null};
if(hasBadDebt) return{level:“แย่”,color:”#ef4444”,pct:0};
const pct=total>0?Math.round((onTime/total)*100):100;
const avgLate=late>0?Math.round(totalLateDays/late):0;
let level,color;
if(pct>=85&&avgLate<=5){level=“ดีมาก”;color=”#10b981”;}
else if(pct>=70){level=“ดี”;color=”#22c55e”;}
else if(pct>=50){level=“ปานกลาง”;color=”#f59e0b”;}
else{level=“แย่”;color=”#ef4444”;}
return{level,color,pct,avgLate,onTime,late};
}

function DebtModal({data,customers,onSave,onClose}){
const [f,setF]=useState({
customerId:data?.customerId||””,
creditType:data?.creditType||“bad_debt”,
splitMode:data?.splitMode||“shared”,
principalMom:data?.principalMom||””,
principalUs:data?.principalUs||””,
momProfitRatio:data?.momProfitRatio??0.5,
creditPrice:data?.creditPrice||””,
totalInstallments:data?.totalInstallments||””,
startDate:data?.startDate||today(),
interestAmt:data?.interestAmt||””,
note:data?.note||””,
});
const F=x=>setF(p=>({…p,…x}));
const pM=toN(f.principalMom), pU=toN(f.principalUs), cp=toN(f.creditPrice);
const mr=+f.momProfitRatio;
const profit=Math.max(0,cp-pM-pU);
const totalCap=pM+pU||1;

// Preview กำไรตาม mode ที่เลือก
const prevMom = f.splitMode===“separate” ? profit*(pM/totalCap)
: profit*mr;
const prevUs  = f.splitMode===“separate” ? profit*(pU/totalCap)
: profit*(1-mr);

const MODES=[
{
value:“shared”,
icon:“🤝”,
label:“ทุนรวมกัน · กำไรแบ่ง %”,
desc:“ทั้งสองฝ่ายออกทุนรวม แล้วแบ่งกำไรตาม % ที่ตั้งเอง”,

},

desc:“ทุนออกแยกชัดเจน แต่กำไรรวมก่อนแล้วค่อยแบ่งตาม % slider”,
},
];

function save(){
const miss=[];
if(!f.customerId)miss.push(“ลูกค้า”);
if(!(cp>0))miss.push(“ยอดเครดิตรวม”);
if(!(+f.totalInstallments>0))miss.push(“จำนวนงวด”);
if(miss.length){alert(“กรุณากรอก: “+miss.join(”, “));return;}
onSave(normalizeDebt({…f,creditPrice:cp,
totalInstallments:+f.totalInstallments,

}

// ── INTEREST CALCULATOR TAB ───────────────────────────────────────────────────
function InterestCalcTab({textMain,textSub,cardBg}){
const [principal,setPrincipal]=useState(””);
const [months,setMonths]=useState(12);
const [mode,setMode]=useState(“flat”); // flat | reducing

const p=toN(principal);
const rows=[];
for(let r=1;r<=30;r++){
const rate=r/100;
if(mode===“flat”){
const totalInterest=p*rate*months;
const totalPay=p+totalInterest;
const monthly=months>0?totalPay/months:0;
rows.push({rate:r,totalInterest,totalPay,monthly});
} else {
// reducing balance
const mRate=rate/12;
const monthly=mRate>0?p*(mRate*Math.pow(1+mRate,months))/(Math.pow(1+mRate,months)-1):p/months;
const totalPay=monthly*months;
const totalInterest=totalPay-p;
rows.push({rate:r,totalInterest,totalPay,monthly});
}
}
